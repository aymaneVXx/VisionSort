app:
  name: VisionSort
  demo_mode: true
  site_validated: false
  timezone: UTC
runtime:
  model_selection: active_registry
  poll_interval_seconds: 1.0
  max_buffer_size: 3
  preview_jpeg_quality: 82
  recording_segment_seconds: 10
  details_flush_every: 10
  max_inference_queue: 8
  inference_result_ttl_seconds: 5.0
  model_unload_timeout_seconds: 5.0
  model_switch_validation_timeout_seconds: 8.0
gpu:
  allow_training_while_inference: false
  max_concurrent_live_sources: 3
  device: auto
  training_policy: queue
model_promotion:
  require_frozen_test: true
  criteria:
    precision_min: 0.50
    recall_min: 0.50
    map50_min: 0.50
    count_accuracy_min: 0.80
    merge_rate_max: 0.15
    fps_min: 5.0
schema_version: 2
world_coordinate_convention:
  unit: m
  x_axis: conveyor_longitudinal
  y_axis: conveyor_transverse
  z_axis: up
  conveyor_plane_z_m: 0.0
calibration_quality_thresholds:
  min_views: 6
  min_corners_per_view: 8
  min_total_corners: 60
  min_intrinsic_coverage: 0.08
  warning_intrinsic_rms_px: 1.0
  max_intrinsic_rms_px: 3.0
  outlier_sigma: 2.5
  max_view_error_px: 3.5
  min_homography_points: 4
  min_homography_image_coverage: 0.02
  min_homography_world_coverage_m2: 0.0001
  min_collinearity_ratio: 0.005
  min_inlier_ratio: 0.60
  ransac_world_threshold_m: 0.03
  warning_world_rmse_m: 0.015
  max_world_rmse_m: 0.06
  warning_reprojection_rmse_px: 2.0
  max_reprojection_rmse_px: 8.0
  max_world_error_m: 0.15
  max_homography_condition_number: 1.0e12
  ransac_confidence: 0.999
  ransac_max_iterations: 10000
tracking:
  handoff_window_seconds: 0.75
  handoff_buffer_max_items: 1000
  handoff_expiry_seconds: 30.0
  hypothesis_expiry_seconds: 120.0
  event_confirmation_seconds:
    pickup_candidate: 0.05
    picked: 0.15
    carried: 0.25
    drop_candidate: 0.05
    dropped: 0.20
  site_topology:
    edges:
      - from_role: C1
        to_role: C2
        min_transit_s: 0.5
        max_transit_s: 10.0
      - from_role: C2
        to_role: C3
        min_transit_s: 0.2
        max_transit_s: 12.0
  zones:
    C1:
      - zone_id: c1_exit
        kind: exit
        x1: 0.82
        y1: 0.0
        x2: 1.0
        y2: 1.0
    C2:
      - zone_id: c2_entry
        kind: entry
        x1: 0.0
        y1: 0.0
        x2: 0.18
        y2: 1.0
      - zone_id: c2_pick
        kind: pick
        x1: 0.55
        y1: 0.1
        x2: 0.95
        y2: 0.9
    C3:
      - zone_id: c3_entry
        kind: entry
        x1: 0.0
        y1: 0.0
        x2: 0.18
        y2: 1.0
      - zone_id: zone_A
        kind: destination
        x1: 0.50
        y1: 0.15
        x2: 0.75
        y2: 0.50
      - zone_id: zone_B
        kind: destination
        x1: 0.62
        y1: 0.55
        x2: 0.93
        y2: 0.92
